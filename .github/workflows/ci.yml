name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # Python 代码检查
  # ============================================================
  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: 代码风格检查 (flake8)
        run: |
          flake8 routers/ utils/ exceptions/ main.py --count --max-complexity=10 --max-line-length=100 --statistics || echo "检查完成"

  # ============================================================
  # Deploy: CI 通过后 SSH 到服务器构建并部署
  # ============================================================
  deploy:
    name: Deploy to Tencent Cloud
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: prod

    steps:
      - name: 安装 SSH 密钥
        shell: bash
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/id_rsa << 'SSHEOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          SSHEOF
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 拉取最新代码
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=5 \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            cd /home/ubuntu/tianyi_agent_langchain && \
            REMOTE_URL=\$(git remote get-url origin) && \
            if echo \"\$REMOTE_URL\" | grep -q '^https://'; then \
              SSH_URL=\$(echo \"\$REMOTE_URL\" | sed 's|https://github.com/|git@github.com:|') && \
              git remote set-url origin \"\$SSH_URL\" && \
              echo \"已将 remote 切换为 SSH: \$SSH_URL\"; \
            fi && \
            git config http.version HTTP/1.1 && \
            git config http.postBuffer 524288000 && \
            git config http.lowSpeedLimit 0 && \
            git config http.lowSpeedTime 999999 && \
            git pull
          "

      - name: 通过 SSH 执行部署脚本
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=5 \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            export DEEPSEEK_API_KEY='${{ secrets.DEEPSEEK_API_KEY }}'
            export SECRET_KEY='${{ secrets.SECRET_KEY }}'
            export TENCENT_COS_SECRET_ID='${{ secrets.TENCENT_COS_SECRET_ID }}'
            export TENCENT_COS_SECRET_KEY='${{ secrets.TENCENT_COS_SECRET_KEY }}'
            export WECHAT_WEBHOOK_URL='${{ secrets.WECHAT_WEBHOOK_URL }}'
            export API_UPLOAD_KEY='${{ secrets.API_UPLOAD_KEY }}'
            bash /home/ubuntu/tianyi_agent_langchain/deploy.sh
          "
