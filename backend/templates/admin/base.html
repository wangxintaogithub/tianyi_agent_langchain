<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TianYi 管理后台</title>
  <!-- Tabler CSS (企业级 UI 框架) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
  <style>
    body { background: #f5f7fb; }
    .page { min-height: 100vh; }
    .navbar-vertical { width: 260px; }
    .cursor-pointer { cursor: pointer; }
    .badge-perm { font-size: 0.75rem; margin: 2px; }
  </style>
</head>
<body>
  <div class="page">
    <!-- ===== 顶部导航 ===== -->
    <header class="navbar navbar-expand-md navbar-dark bg-dark d-print-none">
      <div class="container-xl">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <h1 class="navbar-brand">
          <span style="font-size:1.5rem;margin-right:8px;">⚡</span>
          TianYi 管理后台
        </h1>
        <div class="navbar-nav flex-row ms-auto">
          <div class="nav-item dropdown">
            <a href="#" class="nav-link d-flex align-items-center" data-bs-toggle="dropdown">
              <span class="avatar avatar-sm bg-primary-lt me-2">👤</span>
              <span>{{ user.display_name }}</span>
            </a>
            <div class="dropdown-menu dropdown-menu-end">
              <span class="dropdown-item-text text-muted">角色: {{ user.role }}</span>
              <div class="dropdown-divider"></div>
              <a class="dropdown-item text-danger" href="#" onclick="logout()">退出登录</a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div class="page-wrapper">
      <div class="container-xl">
        <div class="row g-3">
          <!-- ===== 左侧菜单 ===== -->
          <aside class="col-3">
            <div class="card">
              <div class="list-group list-group-flush">
                <a href="/admin/dashboard" class="list-group-item list-group-item-action d-flex align-items-center {{ 'active' if request.url.path == '/admin/dashboard' else '' }}">
                  <span class="me-2">📊</span> 仪表盘
                </a>
                <a href="/admin/users" class="list-group-item list-group-item-action d-flex align-items-center {{ 'active' if request.url.path == '/admin/users' else '' }}">
                  <span class="me-2">👥</span> 用户管理
                </a>
                <a href="/admin/roles" class="list-group-item list-group-item-action d-flex align-items-center {{ 'active' if request.url.path == '/admin/roles' else '' }}">
                  <span class="me-2">🔒</span> 角色权限
                </a>
                <div class="list-group-item text-muted small">
                  <span class="me-2">⚙️</span> 系统设置
                  <span class="badge bg-secondary ms-2">开发中</span>
                </div>
              </div>
            </div>
          </aside>

          <!-- ===== 主内容区 ===== -->
          <main class="col-9">
            {% block content %}{% endblock %}
          </main>
        </div>
      </div>
    </div>
  </div>

  <!-- Tabler JS -->
  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js"></script>
  <script>
    function logout() {
      fetch('/admin/api/login', { method: 'DELETE' })
        .then(() => window.location.href = '/admin/login');
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
