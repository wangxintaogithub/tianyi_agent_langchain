name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # Python 代码检查
  # ============================================================
  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: 代码风格检查 (flake8)
        run: |
          flake8 routers/ utils/ exceptions/ main.py --count --max-complexity=10 --max-line-length=100 --statistics || echo "检查完成"

  # ============================================================
  # Docker: 构建 + 打包 + SCP 传到服务器 + 部署
  # ============================================================
  deploy:
    name: Build & Deploy to Tencent Cloud
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: prod

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建 Docker 镜像（带层缓存）
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: tianyi-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 安装 SSH 密钥
        shell: bash
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/id_rsa << 'SSHEOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          SSHEOF
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 压缩镜像并传送到服务器
        run: |
          echo "===== 压缩镜像 ====="
          docker save tianyi-app:latest | gzip > /tmp/tianyi-image.tar.gz
          ls -lh /tmp/tianyi-image.tar.gz
          echo "===== 传送镜像到服务器 ====="
          scp /tmp/tianyi-image.tar.gz \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/tianyi-image.tar.gz

      - name: 拉取最新代码 & 加载镜像 & 部署
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            set -e
            export DEEPSEEK_API_KEY='${{ secrets.DEEPSEEK_API_KEY }}'
            export SECRET_KEY='${{ secrets.SECRET_KEY }}'
            export TENCENT_COS_SECRET_ID='${{ secrets.TENCENT_COS_SECRET_ID }}'
            export TENCENT_COS_SECRET_KEY='${{ secrets.TENCENT_COS_SECRET_KEY }}'
            export WECHAT_WEBHOOK_URL='${{ secrets.WECHAT_WEBHOOK_URL }}'

            echo '===== 1. 进入项目目录 ====='
            cd /home/ubuntu/tianyi_agent_langchain

            echo '===== 2. 拉取最新代码 ====='
            git config http.version HTTP/1.1
            git config http.postBuffer 524288000
            git pull

            echo '===== 3. 加载镜像 ====='
            gunzip -c /tmp/tianyi-image.tar.gz | docker load
            rm -f /tmp/tianyi-image.tar.gz

            echo '===== 4. 停止旧容器 ====='
            docker compose -f docker-compose.yml -f docker-compose.prod.yml down || true

            echo '===== 5. 启动新容器 ====='
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

            echo '===== 6. 清理旧镜像 ====='
            docker image prune -f

            echo '===== 7. 检查容器状态 ====='
            sleep 3
            docker ps
          "
