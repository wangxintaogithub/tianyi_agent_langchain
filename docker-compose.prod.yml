# 生产环境 Docker Compose
# 在 docker-compose.yml 基础上叠加部署配置
#
# 域名：xiaoyuetech.online
#
# 使用方式：
#   set DEEPSEEK_API_KEY=sk-xxx
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

version: "3.9"

services:
  # ========================
  # Traefik - 反向代理 + 自动 SSL
  # ========================
  traefik:
    image: traefik:latest
    container_name: langchain-traefik
    restart: unless-stopped
    ports:
      - "80:80"      # HTTP（自动 301 重定向到 HTTPS）
      - "443:443"    # HTTPS
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro   # Docker Provider
      - traefik_data:/data                              # SSL 证书持久化
    environment:
      - ACME_EMAIL=super_shaun@163.com
    depends_on:
      - app
    networks:
      - langchain-net

  # ========================
  # 数据库 - 关闭外网端口
  # ========================
  db:
    ports: []   # 不暴露到宿主机，app 通过 Docker 内部网络连接 db:5432
    networks:
      - langchain-net

  # ========================
  # 应用服务（API + 前端页面 + 管理后台）
  # 一体式 FastAPI 容器，同时提供：
  #   - /api/*         → LangChain API（外部调用）
  #   - /account/*     → 登录/注册页面
  #   - /dashboard     → 管理后台仪表盘
  #   - /admin/*       → 管理功能
  #   - /*             → 首页及其他页面
  # ========================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tianyi-app
    restart: unless-stopped
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:?请设置 DEEPSEEK_API_KEY}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - TEMPERATURE=${TEMPERATURE:-0.7}
      - MAX_TOKENS=${MAX_TOKENS:-2048}
      - VERBOSE=false
      - SECRET_KEY=${SECRET_KEY:?请设置 SECRET_KEY}
      - BASE_URL=https://xiaoyuetech.online
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_PORT=5432
      - DB_NAME=langchain_db
      - CSRF_ENABLED=1
      - CORS_ORIGINS=https://xiaoyuetech.online,https://www.xiaoyuetech.online
      - API_UPLOAD_KEY=${API_UPLOAD_KEY:?请设置 API_UPLOAD_KEY}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=langchain-net"

      # 所有流量 → app 服务
      - "traefik.http.routers.app.rule=Host(`xiaoyuetech.online`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.app.middlewares=app-headers"
      - "traefik.http.services.app.loadbalancer.server.port=8000"

      # www → 裸域名 301 重定向（SEO 友好）
      - "traefik.http.routers.www.rule=Host(`www.xiaoyuetech.online`)"
      - "traefik.http.routers.www.entrypoints=websecure"
      - "traefik.http.routers.www.tls=true"
      - "traefik.http.routers.www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.www.middlewares=www-redirect"
      - "traefik.http.middlewares.www-redirect.redirectregex.regex=^https://www\\\\.xiaoyuetech\\\\.online(.*)"
      - "traefik.http.middlewares.www-redirect.redirectregex.replacement=https://xiaoyuetech.online$${1}"
      - "traefik.http.middlewares.www-redirect.redirectregex.permanent=true"

      # 中间件：转发真实客户端 IP
      - "traefik.http.middlewares.app-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
    networks:
      - langchain-net

volumes:
  traefik_data:

networks:
  langchain-net:
