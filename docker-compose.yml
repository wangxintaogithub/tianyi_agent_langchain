version: "3.9"

services:
  # ========================
  # PostgreSQL + pgvector
  # ========================
  db:
    image: pgvector/pgvector:pg16
    container_name: langchain-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: langchain_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - langchain-net

  # ========================
  # Backend - FastAPI + LangChain
  # ========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: langchain-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:?请设置 DEEPSEEK_API_KEY}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      - TEMPERATURE=${TEMPERATURE:-0.7}
      - MAX_TOKENS=${MAX_TOKENS:-2048}
      - VERBOSE=${VERBOSE:-false}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/langchain_db
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      # 文件上传服务
      - WECHAT_WEBHOOK_URL=${WECHAT_WEBHOOK_URL:-https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=34e58576-7030-47fe-942e-f0571a8751a3}
      - TENCENT_COS_SECRET_ID=${TENCENT_COS_SECRET_ID:-}
      - TENCENT_COS_SECRET_KEY=${TENCENT_COS_SECRET_KEY:-}
      - TENCENT_COS_REGION=${TENCENT_COS_REGION:-ap-guangzhou}
      - TENCENT_COS_BUCKET=${TENCENT_COS_BUCKET:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - langchain-net

  # ========================
  # Frontend - React + Vite
  # ========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: langchain-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - langchain-net

networks:
  langchain-net:
    driver: bridge

volumes:
  pgdata:
