name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # Python 代码检查
  # ============================================================
  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: 代码风格检查 (flake8)
        run: |
          flake8 routers/ utils/ exceptions/ main.py --count --max-complexity=10 --max-line-length=100 --statistics || echo "检查完成"

  # ============================================================
  # Docker: 验证镜像构建
  # ============================================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建 Docker 镜像
        run: docker build -t tianyi-app .

  # ============================================================
  # Deploy: CI 通过后自动部署到腾讯云轻量服务器
  # ============================================================
  deploy:
    name: Deploy to Tencent Cloud
    runs-on: ubuntu-latest
    needs: [lint, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: prod

    steps:
      - name: 安装 SSH 密钥
        shell: bash
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/id_rsa << 'SSHEOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          SSHEOF
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 写入 .env 文件到服务器
        run: |
          cat > /tmp/tianyi-env << 'ENVEOF'
          DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_BASE=https://api.deepseek.com
          DEEPSEEK_MODEL=deepseek-v4-flash
          TEMPERATURE=0.7
          MAX_TOKENS=2048
          VERBOSE=false
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          DB_HOST=db
          DB_USER=postgres
          DB_PASSWORD=postgres
          DB_PORT=5432
          DB_NAME=langchain_db
          CORS_ORIGINS=https://xiaoyuetech.online
          CSRF_ENABLED=1
          TENCENT_COS_SECRET_ID=${{ secrets.TENCENT_COS_SECRET_ID }}
          TENCENT_COS_SECRET_KEY=${{ secrets.TENCENT_COS_SECRET_KEY }}
          TENCENT_COS_REGION=ap-shanghai
          TENCENT_COS_BUCKET=tianyi-1387165427
          WECHAT_WEBHOOK_URL=${{ secrets.WECHAT_WEBHOOK_URL }}
          ENVEOF
          scp -o StrictHostKeyChecking=no /tmp/tianyi-env ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/ubuntu/tianyi_agent_langchain/.env

      - name: 通过 SSH 执行部署脚本
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "bash /home/ubuntu/tianyi_agent_langchain/deploy.sh"
