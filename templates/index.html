<!-- landing page for unauthenticated users -->
{% extends "base.html" %}

{% block title %}首页{% endblock %}

{% block content %}
<div class="container">
    <section class="home-hero">
        <div class="home-hero-copy">
            <p class="home-hero-eyebrow">智能文件处理平台</p>
            <h1 class="home-hero-title">天一助手</h1>
            <p class="home-hero-lead">
                智能解析 PDF、Word、Excel 等文件，自动提取关键信息，
                上传至腾讯云 COS，并通过企业微信实时通知。
                让文件处理更高效、更智能。
            </p>
            <div class="home-hero-actions">
                <a href="{{ url_for('read_register') }}" class="btn btn-primary btn-lg">开始使用</a>
                <a href="{{ url_for('read_login') }}" class="btn btn-outline-secondary btn-lg">登录</a>
            </div>
        </div>
    </section>
</div>
{% endblock %}
