<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - TianYi 管理后台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
  <style>
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; }
    .card { border: none; border-radius: 1rem; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
  </style>
</head>
<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card">
          <div class="card-body p-5 text-center">
            <div class="mb-4">
              <span style="font-size: 3rem;">⚡</span>
              <h2 class="mt-2">TianYi 管理后台</h2>
              <p class="text-muted">请登录以继续</p>
            </div>

            <form id="loginForm" onsubmit="return handleLogin(event)">
              <div class="mb-3 text-start">
                <label class="form-label">用户名</label>
                <input type="text" id="username" class="form-control form-control-lg" placeholder="请输入用户名" required>
              </div>
              <div class="mb-3 text-start">
                <label class="form-label">密码</label>
                <input type="password" id="password" class="form-control form-control-lg" placeholder="请输入密码" required>
              </div>

              <div id="errorMsg" class="alert alert-danger d-none"></div>

              <button type="submit" id="loginBtn" class="btn btn-primary btn-lg w-100">
                登 录
              </button>
            </form>

            <div class="mt-4">
              <small class="text-muted">
                测试账号：admin / editor / viewer<br>
                密码统一：xxx123
              </small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errorMsg');
      btn.disabled = true;
      btn.textContent = '登录中...';
      err.classList.add('d-none');

      try {
        const resp = await fetch('/admin/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await resp.json();
        if (data.ok) {
          window.location.href = '/admin/dashboard';
        } else {
          throw new Error(data.message || '登录失败');
        }
      } catch (e) {
        err.textContent = e.message || '用户名或密码错误';
        err.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        btn.textContent = '登 录';
      }
    }
  </script>
</body>
</html>
