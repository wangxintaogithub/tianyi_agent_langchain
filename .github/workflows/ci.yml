name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ============================================================
  # Python 代码检查
  # ============================================================
  lint:
    name: Lint (Python)
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: 代码风格检查 (flake8)
        run: |
          flake8 routers/ utils/ exceptions/ main.py --count --max-complexity=10 --max-line-length=100 --statistics || echo "检查完成"

  # ============================================================
  # Docker: 构建并推送到镜像仓库
  # ============================================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.build.outputs.DIGEST }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 构建并推送镜像
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/tianyi-agent-langchain:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Deploy: CI 通过后自动部署到腾讯云轻量服务器
  # ============================================================
  deploy:
    name: Deploy to Tencent Cloud
    runs-on: ubuntu-latest
    needs: [lint, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: prod

    steps:
      - name: 安装 SSH 密钥
        shell: bash
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/id_rsa << 'SSHEOF'
          ${{ secrets.SSH_PRIVATE_KEY }}
          SSHEOF
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 拉取最新代码（含 deploy.sh）
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            cd /home/ubuntu/tianyi_agent_langchain && git pull
          "

      - name: 服务器登录 Docker Hub
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            echo '${{ secrets.DOCKER_PASSWORD }}' | docker login -u '${{ secrets.DOCKER_USERNAME }}' --password-stdin
          "

      - name: 通过 SSH 执行部署脚本
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            export DEEPSEEK_API_KEY='${{ secrets.DEEPSEEK_API_KEY }}'
            export SECRET_KEY='${{ secrets.SECRET_KEY }}'
            export TENCENT_COS_SECRET_ID='${{ secrets.TENCENT_COS_SECRET_ID }}'
            export TENCENT_COS_SECRET_KEY='${{ secrets.TENCENT_COS_SECRET_KEY }}'
            export WECHAT_WEBHOOK_URL='${{ secrets.WECHAT_WEBHOOK_URL }}'
            bash /home/ubuntu/tianyi_agent_langchain/deploy.sh
          "
